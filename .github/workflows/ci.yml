name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    # Throwaway Postgres for the duration of this job only -- same
    # user/password/port supabase/tests/run.sh already expects via the
    # standard PG* environment variables below.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgres

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install Postgres client tools
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - run: npm ci

      - name: JS unit tests (availability engine, error mapping)
        run: npm test

      - name: Production build (no env vars set, matching a fresh deploy)
        run: npm run build

      - name: SQL test suite (RLS, validation rules, concurrency)
        run: npm run test:sql
